<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔐 Secret Key Generator</title>
<!-- ✅ Canonical -->
<link rel="canonical" href="https://editanku.com/secret-key-generator/" />
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../asset/css/donate.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at top left,#334,#111 40%),
    radial-gradient(circle at bottom right,#135,#111);
}

.panel{
    width:100%;
    max-width:900px;
    background:rgba(20,20,20,.8);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:25px;
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(0,0,0,.5);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

h1{
    margin:0;
}

button{
    border:none;
    border-radius:10px;
    background:#4f8cff;
    color:white;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#6ba0ff;
}

.controls{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:rgba(255,255,255,.05);
    border-radius:15px;
    padding:15px;
}

label{
    display:block;
    margin-bottom:10px;
}

input[type=number]{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
}

.check{
    margin-bottom:8px;
}

#output{
    margin-top:25px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.key{
    background:#1b1b1b;
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.key span{
    flex:1;
    word-break:break-all;
    font-family:monospace;
}

.copyBtn{
    flex-shrink:0;
}

@media(max-width:700px){

    .key{
        flex-direction:column;
        align-items:stretch;
    }

}
</style>
</head>
<body>

<div class="panel">

<div class="header">
<h1>🔐 Secret Key Generator</h1>
</div>

<div class="controls">

<div class="card">
<label>Length</label>
<input id="length" type="number" min="1" value="32">
</div>

<div class="card">
<label>Number of Keys</label>
<input id="count" type="number" min="1" value="5">
</div>

<div class="card">
<div class="check">
<label><input id="lower" type="checkbox" checked> Lowercase (a-z)</label>
</div>

<div class="check">
<label><input id="upper" type="checkbox" checked> Uppercase (A-Z)</label>
</div>

<div class="check">
<label><input id="number" type="checkbox" checked> Numbers (0-9)</label>
</div>

<div class="check">
<label><input id="symbol" type="checkbox"> Symbols</label>
</div>

</div>

</div>
<button id="refreshBtn">🔄 Refresh</button>
<div id="output"></div>

</div>
<!--include:donate.html-->
<script src="../asset/js/include.js"></script>
<script src="../asset/js/donate.js"></script>

<script>

const lengthInput = document.getElementById("length");
const countInput = document.getElementById("count");

const lowerInput = document.getElementById("lower");
const upperInput = document.getElementById("upper");
const numberInput = document.getElementById("number");
const symbolInput = document.getElementById("symbol");

const output = document.getElementById("output");
const refreshBtn = document.getElementById("refreshBtn");

function randomKey(length, chars){

    const bytes = new Uint32Array(length);
    crypto.getRandomValues(bytes);

    let key = "";

    for(let i=0;i<length;i++){
        key += chars[bytes[i] % chars.length];
    }

    return key;
}

function generate(){

    let chars = "";

    if(lowerInput.checked)
        chars += "abcdefghijklmnopqrstuvwxyz";

    if(upperInput.checked)
        chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    if(numberInput.checked)
        chars += "0123456789";

    if(symbolInput.checked)
        chars += "!@#$%^&*()-_=+[]{}<>?/";

    output.innerHTML = "";

    if(chars.length===0){

        output.innerHTML =
        "<div class='key'><span>Select at least one character type.</span></div>";

        return;
    }

    let len = parseInt(lengthInput.value) || 32;
    let cnt = parseInt(countInput.value) || 5;

    for(let i=0;i<cnt;i++){

        let key = randomKey(len,chars);

        let div = document.createElement("div");
        div.className = "key";

        let span = document.createElement("span");
        span.textContent = key;

        let btn = document.createElement("button");
        btn.className = "copyBtn";
        btn.textContent = "Copy";

        btn.onclick = () => {

            navigator.clipboard.writeText(key);

            btn.textContent = "Copied!";

            setTimeout(()=>{
                btn.textContent = "Copy";
            },1000);

        };

        div.appendChild(span);
        div.appendChild(btn);

        output.appendChild(div);
    }

}

document.querySelectorAll("input").forEach(el=>{

    el.addEventListener("input",generate);
    el.addEventListener("change",generate);

});

refreshBtn.addEventListener("click",generate);

// Generate immediately on page load
generate();

</script>

</body>
</html>
