<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Browser PDF Repair Pipeline</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #0f172a;
  color: #e2e8f0;
}
header {
  padding: 16px;
  background: #111827;
  text-align: center;
  font-size: 18px;
}
.container {
  padding: 16px;
  max-width: 1000px;
  margin: auto;
}
input, button {
  padding: 10px;
  margin: 8px 0;
  width: 100%;
}
button {
  background: #2563eb;
  border: none;
  color: white;
  cursor: pointer;
}
button:hover {
  background: #1d4ed8;
}
.status {
  background: #1f2937;
  padding: 10px;
  margin-top: 10px;
  min-height: 40px;
}
.preview {
  margin-top: 10px;
  background: #111827;
  padding: 10px;
  overflow: auto;
  max-height: 500px;
}
canvas {
  max-width: 100%;
  margin-bottom: 10px;
}
small {
  color: #94a3b8;
}
</style>
</head>

<body>
<header>PDF Repair Pipeline (Client-Side Multi-Engine)</header>

<div class="container">
  <input type="file" id="file" accept="application/pdf"/>
  <button onclick="startRepair()">Start Repair</button>

  <div class="status" id="status">Waiting for file...</div>

  <button id="downloadBtn" style="display:none" onclick="downloadPDF()">Download Fixed PDF</button>

  <div class="preview" id="preview"></div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.js"></script>

<!-- pdf-lib -->
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<!-- MuPDF WASM (optional heavy fallback) -->
<script>
let repairedBytes = null;

function log(msg){
  document.getElementById("status").innerText = msg;
}

/* =========================
   PIPELINE CONTROLLER
========================= */

async function startRepair(){
  const file = document.getElementById("file").files[0];
  if(!file){
    alert("Select a PDF first");
    return;
  }

  const buffer = await file.arrayBuffer();
  log("Step 0: Loading file...");

  try {
    await tryPDFJS(buffer);
    log("Repaired using PDF.js render rebuild");
    return;
  } catch(e){
    console.log("PDF.js failed", e);
  }

  try {
    await tryPdfLib(buffer);
    log("Repaired using pdf-lib rebuild");
    return;
  } catch(e){
    console.log("pdf-lib failed", e);
  }

  try {
    await rasterFallback(buffer);
    log("Repaired using raster fallback");
    return;
  } catch(e){
    console.log("Raster failed", e);
  }

  log("All engines failed. File too corrupted.");
}

/* =========================
   ENGINE 1: PDF.js render
========================= */

async function tryPDFJS(buffer){
  log("Engine 1: PDF.js parsing...");

  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;

  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  const canvasList = [];

  for(let i=1;i<=pdf.numPages;i++){
    log(`PDF.js rendering page ${i}/${pdf.numPages}`);

    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.5});

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await page.render({canvasContext: ctx, viewport}).promise;

    preview.appendChild(canvas);
    canvasList.push(canvas);
  }

  // rebuild PDF from rendered images
  const { PDFDocument } = PDFLib;
  const newPdf = await PDFDocument.create();

  for(const c of canvasList){
    const img = c.toDataURL("image/jpeg", 0.9);
    const jpg = await newPdf.embedJpg(img);
    const page = newPdf.addPage([c.width, c.height]);
    page.drawImage(jpg, {x:0,y:0,width:c.width,height:c.height});
  }

  repairedBytes = await newPdf.save();
  document.getElementById("downloadBtn").style.display = "block";
}

/* =========================
   ENGINE 2: pdf-lib rewrite
========================= */

async function tryPdfLib(buffer){
  log("Engine 2: pdf-lib rebuilding structure...");

  const { PDFDocument } = PDFLib;

  const pdfDoc = await PDFDocument.load(buffer, {
    ignoreEncryption: true
  });

  const newPdf = await PDFDocument.create();
  const pages = await newPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());

  pages.forEach(p => newPdf.addPage(p));

  repairedBytes = await newPdf.save();
  document.getElementById("downloadBtn").style.display = "block";
}

/* =========================
   ENGINE 3: raster fallback
========================= */

async function rasterFallback(buffer){
  log("Engine 3: rasterizing all pages...");

  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  const { PDFDocument } = PDFLib;
  const newPdf = await PDFDocument.create();

  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 2});

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({canvasContext: ctx, viewport}).promise;

    preview.appendChild(canvas);

    const img = canvas.toDataURL("image/jpeg", 0.95);
    const jpg = await newPdf.embedJpg(img);

    const p = newPdf.addPage([canvas.width, canvas.height]);
    p.drawImage(jpg, {x:0,y:0,width:canvas.width,height:canvas.height});
  }

  repairedBytes = await newPdf.save();
  document.getElementById("downloadBtn").style.display = "block";
}

/* =========================
   DOWNLOAD
========================= */

function downloadPDF(){
  const blob = new Blob([repairedBytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "repaired.pdf";
  a.click();
}
</script>

</body>
</html>
