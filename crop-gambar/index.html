<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image Crop Tool</title>
<link rel="stylesheet" href="../asset/css/donate.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

  body {
    min-height: 100vh;
    color: #fff;
    background: radial-gradient(circle at top, #1b1b2f, #0a0a12 70%);
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    gap: 12px;
  }

  .workspace {
    width: 100%;
    max-width: 900px;
    height: 60vh;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* Upload */
  .upload {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
  }

  .upload input {
    display: none;
  }

  .upload-box {
    padding: 20px;
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 10px;
    text-align: center;
  }

  /* Crop stage */
  .crop-stage {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: none;
  }

  .img-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center;
    cursor: grab;
  }

  .img-wrapper img {
    display: block;
    max-width: none;
    user-select: none;
    pointer-events: none;
  }

  .crop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  .crop-box {
    position: relative;
    border: 2px solid #00d4ff;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.6);
  }

  /* Controls */
.controls {
  width: 100%;
  max-width: 900px;
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

/* MOBILE: STACKED CONTROLS */
@media (max-width: 600px) {
  .controls {
    flex-direction: column;
    align-items: stretch;
  }

  .controls button,
  .controls select,
  .controls input[type="range"],
  .controls label {
    width: 100%;
  }

  .controls label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
  }
}
.controls button {
  padding: 12px;
  font-size: 14px;
}

.controls select {
  padding: 12px;
}

.controls input[type="range"] {
  width: 100%;
}

  button, select, input[type="range"] {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 8px 10px;
    border-radius: 8px;
  }

  button { cursor: pointer; }

  button:hover {
    background: rgba(255,255,255,0.15);
  }

  /* Download */
  .download-stage {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  canvas {
    max-width: 100%;
    border-radius: 10px;
  }

  /* Writing section */
  .writing {
    width: 100%;
    max-width: 900px;
  }

  textarea {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    resize: none;
  }

  @media (max-width: 600px) {
    .workspace { height: 55vh; }
  }
</style>
</head>
<body>

<header>Image Crop Tool</header>

<div class="container">

  <div class="workspace">

    <!-- UPLOAD -->
    <div class="upload" id="uploadStage">
      <div class="upload-box">
        Click or Drag Image Here
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- CROP -->
    <div class="crop-stage" id="cropStage">
      <div class="img-wrapper" id="imgWrapper">
        <img id="image" />
      </div>

      <div class="crop-overlay">
        <div class="crop-box" id="cropBox"></div>
      </div>
    </div>

    <!-- DOWNLOAD -->
    <div class="download-stage" id="downloadStage">
      <canvas id="canvas"></canvas>
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="controls" id="controls">
<div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
  <label>Crop Ratio</label>

  <select id="ratioSelect">
    <option value="1">1:1 — Square (Instagram post)</option>
    <option value="1.333">4:3 — Classic photo</option>
    <option value="1.777">16:9 — Widescreen (YouTube)</option>
    <option value="0.8">4:5 — Portrait (Instagram feed)</option>

    <!-- NEW ADDITIONS -->
    <option value="0.5625">9:16 — Vertical (TikTok / Shorts)</option>
    <option value="1.91">1.91:1 — Facebook / banner</option>
    <option value="2.35">21:9 — Cinematic ultra-wide</option>
    <option value="0.666">2:3 — Classic portrait photo</option>
  </select>

  <div id="ratioDesc" style="font-size:12px; opacity:0.8; text-align:center;">
    Square format — best for profile pictures
  </div>
</div>

    <label>Crop Size
      <input type="range" id="zoom" min="0.5" max="3" step="0.01" value="1">
    </label>

    <button onclick="finishCrop()">Crop</button>
    <button onclick="downloadImage()">Download</button>
    <button onclick="resetAll()">Reset</button>

  </div>

</div>
<!--include:donate.html-->
<script src="../asset/js/include.js"></script>
<script src="../asset/js/donate.js"></script>
<script>
let state = "upload";
let img = document.getElementById("image");
let wrapper = document.getElementById("imgWrapper");
let cropBox = document.getElementById("cropBox");

let scale = 1;
let posX = 0, posY = 0;
let dragging = false;
let startX, startY;
let cropScale = 0.7;
const uploadStage = document.getElementById("uploadStage");
const cropStage = document.getElementById("cropStage");
const downloadStage = document.getElementById("downloadStage");

const fileInput = document.getElementById("fileInput");
uploadStage.addEventListener("click", () => fileInput.click());

fileInput.onchange = e => loadImage(e.target.files[0]);

uploadStage.ondragover = e => e.preventDefault();
uploadStage.ondrop = e => {
  e.preventDefault();
  loadImage(e.dataTransfer.files[0]);
};

const zoomSlider = document.getElementById("zoom");

zoomSlider.oninput = e => {
  cropScale = parseFloat(e.target.value);
  updateCropBox();
};


function loadImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    img.src = e.target.result;
    setState("crop");
  };
  reader.readAsDataURL(file);
}

function setState(s) {
  state = s;
  uploadStage.style.display = s === "upload" ? "flex" : "none";
  cropStage.style.display = s === "crop" ? "block" : "none";
  downloadStage.style.display = s === "download" ? "flex" : "none";
}

img.onload = () => {
  resetTransform();
  updateCropBox();
};

function resetTransform() {
  scale = 1;
  posX = 0;
  posY = 0;
  updateTransform();
}

function updateTransform() {
  wrapper.style.transform = `translate(-50%,-50%) translate(${posX}px,${posY}px) scale(${scale})`;
}


function setZoom(newScale) {
  scale = Math.min(10, Math.max(0.01, newScale));
  zoomSlider.value = scale;
  updateTransform();
}

cropStage.addEventListener("wheel", (e) => {
  e.preventDefault();

  const zoomIntensity = 0.0015;
  const delta = -e.deltaY * zoomIntensity;

  setZoom(scale * (1 + delta));
}, { passive: false });

let lastTouchDist = null;

function getTouchDistance(t1, t2) {
  return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
}

cropStage.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    lastTouchDist = getTouchDistance(e.touches[0], e.touches[1]);
  }
});

cropStage.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();

    const newDist = getTouchDistance(e.touches[0], e.touches[1]);

    if (lastTouchDist) {
      const diff = newDist - lastTouchDist;
      setZoom(scale + diff * 0.005);
    }

    lastTouchDist = newDist;
  }
}, { passive: false });

cropStage.addEventListener("touchend", () => {
  lastTouchDist = null;
});

wrapper.addEventListener("mousedown", startDrag);
wrapper.addEventListener("touchstart", startDrag);

function startDrag(e) {
  dragging = true;
  startX = (e.touches ? e.touches[0].clientX : e.clientX) - posX;
  startY = (e.touches ? e.touches[0].clientY : e.clientY) - posY;
}

window.addEventListener("mousemove", moveDrag);
window.addEventListener("touchmove", moveDrag);

function moveDrag(e) {
  if (!dragging) return;
  posX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
  posY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
  updateTransform();
}

window.addEventListener("mouseup", () => dragging = false);
window.addEventListener("touchend", () => dragging = false);

/* Crop box ratio */
document.getElementById("ratioSelect").onchange = updateCropBox;

function updateCropBox() {
  let ratio = parseFloat(document.getElementById("ratioSelect").value);

  let maxW = cropStage.clientWidth;
  let maxH = cropStage.clientHeight;

  let w = maxW * cropScale;
  let h = w / ratio;

  if (h > maxH * cropScale) {
    h = maxH * cropScale;
    w = h * ratio;
  }

  cropBox.style.width = w + "px";
  cropBox.style.height = h + "px";
}


window.onresize = updateCropBox;

/* Crop logic */
function finishCrop() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const rect = cropBox.getBoundingClientRect();
  const stageRect = cropStage.getBoundingClientRect();
  const imgRect = img.getBoundingClientRect();

  canvas.width = rect.width;
  canvas.height = rect.height;

  const scaleFactor = scale;

  const imgX = (stageRect.width / 2 + posX - img.naturalWidth * scale / 2);
  const imgY = (stageRect.height / 2 + posY - img.naturalHeight * scale / 2);

  ctx.drawImage(
    img,
    (rect.left - imgRect.left) / scaleFactor,
    (rect.top - imgRect.top) / scaleFactor,
    rect.width / scaleFactor,
    rect.height / scaleFactor,
    0,
    0,
    rect.width,
    rect.height
  );

  setState("download");
}

function downloadImage() {
  const canvas = document.getElementById("canvas");
  const link = document.createElement("a");
  link.download = "cropped.png";
  link.href = canvas.toDataURL();
  link.click();
}

function resetAll() {
  setState("upload");
  img.src = "";
  fileInput.value = "";
}
</script>

</body>
</html>
