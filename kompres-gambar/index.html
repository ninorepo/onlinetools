<body>
	<header>
		<h1>Kompres Gambar Online Gratis</h1>
		<p>Kecilkan ukuran gambar tanpa mengurangi kualitas yang nampak. Gratis tanpa iklan, no ribet.</p>
	</header>
<div class="container">
<div class="dropzone" id="dropzone">
Klik / Drag &amp; Drop Image
<input type="file" id="fileInput" multiple accept="image/*">
</div>

<!-- MODE SWITCH -->
<div class="controls">
  <label>
    Mode
    <select id="mode">
      <option value="manual">Manual</option>
      <option value="target">Target Size</option>
    </select>
  </label>

  <label id="qualityBox">
    Quality
    <input type="range" id="quality" min="10" max="100" value="80">
  </label>

  <label id="dpiBox">
    Scale
    <select id="dpi">
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
  </label>

  <label id="targetBox" style="display:none;">
    Target KB
    <input type="number" id="target" value="200" min="10">
  </label>
</div>

<div id="preview"></div>

</div>
<footer></footer>
<!--include:donate.html-->

<script src="../asset/js/include.js"></script>
<script src="../asset/js/donate.js"></script>
<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

const modeEl = document.getElementById("mode");
const qualityEl = document.getElementById("quality");
const dpiEl = document.getElementById("dpi");
const targetEl = document.getElementById("target");

const qualityBox = document.getElementById("qualityBox");
const dpiBox = document.getElementById("dpiBox");
const targetBox = document.getElementById("targetBox");

let filesData = [];

dropzone.onclick = () => fileInput.click();
fileInput.onchange = e => handleFiles(e.target.files);

dropzone.ondragover = e => e.preventDefault();
dropzone.ondrop = e => {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
};

/* =========================
   FORMAT DETECTION (AUTO)
========================= */

function getMime(type) {

  // use browser mime directly
  if (type && type.startsWith("image/")) {
    return type;
  }

  // safe fallback
  return "image/jpeg";
}

function getExt(filename, mime) {

  // keep original extension if possible
  const parts = filename.split(".");

  if (parts.length > 1) {
    return parts.pop().toLowerCase();
  }

  // fallback from mime
  return mime.split("/")[1] || "jpg";
}

/* =========================
   FILE HANDLER
========================= */
function handleFiles(files) {
  for (let f of files) {
    if (!f.type.startsWith("image")) continue;

    const r = new FileReader();
    r.onload = e => {
      filesData.push({
        name: f.name,
        type: f.type,
        src: e.target.result,
        file: f
      });
      render();
    };
    r.readAsDataURL(f);
  }
}

function forceJpeg(imgSrc, quality, scale, cb) {
  const img = new Image();
  img.src = imgSrc;

  img.onload = () => {
    const canvas = document.createElement("canvas");

    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext("2d");

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      cb(URL.createObjectURL(blob), blob);
    }, "image/jpeg", quality);
  };
}

/* =========================
   COMPRESS CORE
========================= */
function compress(imgSrc, quality, scale, mime, cb) {

  const img = new Image();
  img.src = imgSrc;

  img.onload = async () => {
  await img.decode().catch(() => {});

    const canvas = document.createElement("canvas");

    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext("2d");

    // preserve transparency
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // PNG ignores quality
    const useQuality =
      mime !== "image/png";

    canvas.toBlob(

      blob => {
        cb(URL.createObjectURL(blob), blob);
      },

      mime,

      useQuality ? quality : undefined

    );
  };
}


/* =========================
   TARGET SIZE MODE
========================= */
function compressTarget(imgSrc, targetKB, scale, mime, cb) {

  const img = new Image();
img.src = imgSrc;

img.onload = async () => {
  await img.decode().catch(() => {});

    let q = 0.92;

    const canvas = document.createElement("canvas");

    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const useQuality =
      mime !== "image/png";

    const run = () => {

      canvas.toBlob(blob => {

        const size = blob.size / 1024;

        if (
          useQuality &&
          size > targetKB &&
          q > 0.1
        ) {

          q -= 0.05;
          run();

        } else {

          cb(URL.createObjectURL(blob), blob);

        }

      }, mime, useQuality ? q : undefined);

    };

    run();
  };
}

/* =========================
   RENDER PIPELINE
========================= */
function render() {
  preview.innerHTML = "";

  const mode = modeEl.value;
  const scale = parseFloat(dpiEl.value);

  filesData.forEach(item => {

    const mime = getMime(item.type);
    const ext = getExt(item.name, mime)

    const card = document.createElement("div");
    card.className = "card";

card.innerHTML = `
  <img src="${item.src}">
  <div class="small">Original: ${(item.file.size/1024).toFixed(1)} KB</div>

  <div class="status">Processing...</div>

  <div class="hint" style="display:none; font-size:12px; opacity:0.7;">
    Kompresi tidak efektif, output otomatis diubah ke JPG sebagai alternatif
  </div>

  <button>Download</button>
`;

    preview.appendChild(card);

    const status = card.querySelector(".status");
    const btn = card.querySelector("button");

    if (mode === "manual") {

      const q = qualityEl.value / 100;
compress(item.src, q, scale, mime, (url, blob) => {

  const originalSize = item.file.size;
  const newSize = blob.size;

  const isBadResult =
    !blob ||
    newSize >= originalSize * 0.98 || // not smaller enough
    newSize === 0;

  if (isBadResult) {

    status.innerHTML = "Untuk format ini, hanya efektif jika dikompresi menjadi JPG";
    card.querySelector(".hint").style.display = "block";

    forceJpeg(item.src, 0.85, scale, (jpgUrl, jpgBlob) => {

      status.innerHTML =
        `Fallback JPG: ${(jpgBlob.size / 1024).toFixed(2)} KB`;

      const name =
        "compressed_" +
        item.name.split(".")[0] +
        ".jpg";

      btn.onclick = () => {
        const a = document.createElement("a");
        a.href = jpgUrl;
        a.download = name;
        a.click();
      };
    });

    return;
  }

  // normal success
  status.innerHTML =
    `Compressed: ${(blob.size / 1024).toFixed(2)} KB`;

  const name =
    "compressed_" +
    item.name.split(".")[0] +
    "." + ext;

  btn.onclick = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
  };

});


    } else {

      const target = parseFloat(targetEl.value);

      compressTarget(item.src, target, scale, mime, (url, blob) => {
        status.innerHTML = `Target: ${(blob.size/1024).toFixed(2)} KB`;

        const name = "compressed_" + item.name.split(".")[0] + "." + ext;

        btn.onclick = () => {
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          a.click();
        };
      });
    }
  });
}

/* =========================
   MODE SWITCH UI
========================= */
modeEl.onchange = () => {
  if (modeEl.value === "manual") {
    qualityBox.style.display = "block";
    dpiBox.style.display = "block";
    targetBox.style.display = "none";
  } else {
    qualityBox.style.display = "none";
    dpiBox.style.display = "block";
    targetBox.style.display = "block";
  }

  render();
};

qualityEl.oninput = render;
dpiEl.onchange = render;
targetEl.oninput = render;

</script>
</body>
