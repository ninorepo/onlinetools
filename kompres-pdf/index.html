<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDF Compressor</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111a2e;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --primary:#3b82f6;
  --danger:#ef4444;
  --border:#1f2a44;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

h2{text-align:center;}

.warning{
  background:#7c2d12;
  color:#fff;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
  line-height:1.4;
}

.stepbar{
  display:flex;
  gap:5px;
  margin-bottom:20px;
}

.step{
  flex:1;
  padding:8px;
  text-align:center;
  font-size:12px;
  border-radius:6px;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border);
}

.step.active{
  background:var(--primary);
  color:white;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  border:1px solid var(--border);
}

p{color:var(--muted);}

.row{
  display:flex;
  gap:10px;
  justify-content:space-between;
  margin-top:10px;
}

button{
  padding:9px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1f2a44;
  color:var(--text);
  font-weight:bold;
}

button.primary{background:var(--primary);color:white;}
button.danger{background:var(--danger);color:white;}

input[type="file"],input[type="range"]{width:100%;}

.progress{
  width:100%;
  height:10px;
  background:#1f2a44;
  border-radius:6px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:var(--primary);
}

a{color:var(--primary);text-decoration:none;}
</style>
</head>

<body>

<div class="container">

  <h2>PDF Compressor</h2>

  <!-- ⚠️ WARNING -->
  <div class="warning">
    ⚠️ This tool requires a modern browser (Chrome 100+, Edge, Firefox latest).<br>
    If you see errors like "structuredClone is not defined", your browser is outdated.
  </div>

  <div class="stepbar">
    <div class="step" id="s1">Upload</div>
    <div class="step" id="s2">Settings</div>
    <div class="step" id="s3">Processing</div>
    <div class="step" id="s4">Done</div>
  </div>

  <!-- STEP 1 -->
  <div class="card" id="step1">
    <input type="file" id="fileInput" accept="application/pdf"/>
    <p>Select PDF file</p>
  </div>

  <!-- STEP 2 -->
  <div class="card" id="step2" style="display:none;">
    <p id="filename"></p>

    <label>Compression Quality</label>
    <input type="range" id="quality" min="0.3" max="1" step="0.1" value="0.7"/>

    <p id="sizeInfo"></p>

    <div class="row">
      <button onclick="back()">Back</button>
      <button class="primary" onclick="startCompress()">Compress</button>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="card" id="step3" style="display:none;">
    <p>Processing PDF...</p>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <p id="percent">0%</p>

    <button class="danger" onclick="cancel()">Cancel</button>
  </div>

  <!-- STEP 4 -->
  <div class="card" id="step4" style="display:none;">
    <p>Done ✔</p>

    <p id="finalSize"></p>

    <a id="download" href="#" download="compressed.pdf">Download</a>

    <div class="row">
      <button onclick="resetAll()">New File</button>
    </div>
  </div>
</div>

<!-- LIBS -->
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* =========================
   FIX 1: structuredClone polyfill
========================= */
if (!window.structuredClone) {
  window.structuredClone = (obj) => {
    if (obj === undefined) return undefined;
    return JSON.parse(JSON.stringify(obj));
  };
}

/* =========================
   FIX 2: pdf.js worker
========================= */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let file=null;
let quality=0.7;
let originalSize=0;
let cancelled=false;
let outputUrl=null;
let interval=null;

function formatSize(b){
  if(b<1024) return b+" B";
  if(b<1024*1024) return (b/1024).toFixed(1)+" KB";
  return (b/1024/1024).toFixed(2)+" MB";
}

function setStep(n){
  for(let i=1;i<=4;i++){
    document.getElementById("step"+i).style.display=(i===n)?"block":"none";
    document.getElementById("s"+i).classList.toggle("active",i===n);
  }
}

setStep(1);
document.getElementById("s1").classList.add("active");

document.getElementById("fileInput").onchange=(e)=>{
  file=e.target.files[0];
  if(!file) return;

  originalSize=file.size;

  document.getElementById("filename").innerText=file.name;
  updateEstimate();

  setStep(2);
};

document.getElementById("quality").oninput=(e)=>{
  quality=parseFloat(e.target.value);
  updateEstimate();
};

function updateEstimate(){
  const factor=quality*0.6;
  const est=originalSize*factor;

  document.getElementById("sizeInfo").innerHTML=
    "Original: "+formatSize(originalSize)+"<br>"+
    "Estimated: "+formatSize(est)+"<br>"+
    "Savings: "+Math.round((1-factor)*100)+"%";
}

function back(){setStep(1);}

function fakeProgress(){
  let p=0;
  interval=setInterval(()=>{
    if(cancelled) return;
    p+=Math.random()*8;
    if(p>95) p=95;
    document.getElementById("bar").style.width=p+"%";
    document.getElementById("percent").innerText=Math.floor(p)+"%";
  },200);
}

async function startCompress() {
  setStep(3);
  cancelled = false;
  fakeProgress();

  try {
    const data = await file.arrayBuffer();

    const loadingTask = pdfjsLib.getDocument({ data });
    const pdf = await loadingTask.promise;

    const newPdf = await PDFLib.PDFDocument.create();

    let validPages = 0;

    for (let i = 1; i <= pdf.numPages; i++) {

      try {
        const page = await pdf.getPage(i);

        // 🔥 safer scale (increase if blank pages happen)
        const viewport = page.getViewport({ scale: 1.5 });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;

        // 🔥 HARD CHECK (IMPORTANT)
        if (canvas.width === 0 || canvas.height === 0) {
          console.warn("Skipping empty canvas page:", i);
          continue;
        }

        // convert to image
        const imgData = canvas.toDataURL("image/jpeg", quality);

        // 🔥 validate image
        if (!imgData || imgData.length < 1000) {
          console.warn("Skipping invalid image page:", i);
          continue;
        }

        const img = await newPdf.embedJpg(imgData);

        const newPage = newPdf.addPage([canvas.width, canvas.height]);

        newPage.drawImage(img, {
          x: 0,
          y: 0,
          width: canvas.width,
          height: canvas.height
        });

        validPages++;

      } catch (e) {
        console.warn("Page failed:", i, e);
        continue;
      }

      const prog = (i / pdf.numPages) * 100;
      document.getElementById("bar").style.width = prog + "%";
      document.getElementById("percent").innerText = Math.floor(prog) + "%";
    }

    // 🚨 IMPORTANT CHECK
    if (validPages === 0) {
      throw new Error("No pages could be processed. PDF rendering failed.");
    }

    const bytes = await newPdf.save();

    if (!bytes || bytes.length === 0) {
      throw new Error("Output PDF is empty after save()");
    }

    if (cancelled) return;

    clearInterval(interval);

    const blob = new Blob([bytes], { type: "application/pdf" });
    outputUrl = URL.createObjectURL(blob);

    document.getElementById("download").href = outputUrl;

    document.getElementById("finalSize").innerHTML =
      "Original: " + formatSize(originalSize) + "<br>" +
      "Compressed: " + formatSize(bytes.length) + "<br>" +
      "Pages processed: " + validPages + "<br>" +
      "Savings: " + Math.round((1 - bytes.length / originalSize) * 100) + "%";

    setTimeout(() => setStep(4), 300);

  } catch (err) {
    console.error("FULL ERROR:", err);
    alert("Compression failed: " + err.message);
    resetAll();
  }
}


function cancel(){
  cancelled=true;
  clearInterval(interval);
  resetAll();
}

function resetAll(){
  file=null;
  cancelled=false;
  document.getElementById("fileInput").value="";
  document.getElementById("bar").style.width="0%";
  document.getElementById("percent").innerText="0%";
  setStep(1);
}
</script>

</body>
</html>
