<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Split PDF Online Gratis</title>

<meta name="description" content="Pisahkan halaman PDF online gratis langsung di browser.">
<meta name="keywords" content="split pdf,pisahkan pdf,pdf splitter">
<meta name="robots" content="index,follow">

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.desc{
  text-align:center;
  color:#555;
  margin-bottom:20px;
}

.upload-box{
  background:#fff;
  border:2px dashed #bbb;
  border-radius:10px;
  padding:25px;
  margin-bottom:20px;
}

input[type=file]{
  width:100%;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

.range-box{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  width:100%;
}

.range-box input{
  flex:1;
  min-width:200px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.preview-container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.page-card{
  background:#fff;
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.page-card canvas{
  width:100%;
  border:1px solid #ddd;
  border-radius:6px;
}

.loading{
  text-align:center;
  margin:20px 0;
  font-weight:bold;
}

@media(max-width:600px){

  .controls{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>
<body>

<div class="container">

<h1>Split PDF Online Gratis</h1>

<p class="desc">
Pisahkan halaman PDF langsung di browser tanpa upload server
</p>

<div class="upload-box">
  <input type="file" id="pdfInput" accept="application/pdf">
</div>

<div class="controls">

  <button id="downloadSelected">
    Download Halaman Terpilih
  </button>

  <button id="downloadAll">
    Pisahkan Semua Halaman
  </button>

  <div class="range-box">

    <input
      type="text"
      id="rangeInput"
      placeholder="Contoh: 1-3,5,6-7"
    >

    <button id="downloadRange">
      Pisah Dengan Range
    </button>

  </div>

</div>

<div class="loading" id="loading"></div>

<div class="preview-container" id="previewContainer"></div>

</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- PDF-LIB -->
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const pdfInput = document.getElementById('pdfInput');
const previewContainer = document.getElementById('previewContainer');
const loading = document.getElementById('loading');

let pdfBytes = null;
let pdfDoc = null;

pdfInput.addEventListener('change', async function(e){

  const file = e.target.files[0];

  if(!file) return;

  loading.innerText = 'Memuat PDF...';
  previewContainer.innerHTML = '';

  pdfBytes = await file.arrayBuffer();

  try{

    pdfDoc = await pdfjsLib.getDocument({
      data: pdfBytes
    }).promise;

    for(let i=1;i<=pdfDoc.numPages;i++){

      const page = await pdfDoc.getPage(i);

      const viewport = page.getViewport({
        scale:1
      });

      const canvas = document.createElement('canvas');

      const context = canvas.getContext('2d');

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext:context,
        viewport:viewport
      }).promise;

      const card = document.createElement('div');

      card.className = 'page-card';

      card.innerHTML = `
        <label>
          <input type="checkbox" value="${i}">
          Halaman ${i}
        </label>
      `;

      card.prepend(canvas);

      previewContainer.appendChild(card);
    }

    loading.innerText = '';

  }catch(err){

    console.error(err);

    loading.innerText = 'Gagal membuka PDF';
  }

});

function downloadBlob(bytes, filename){

  const blob = new Blob([bytes], {
    type:'application/pdf'
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

async function createPdf(pageIndexes, filename){

  const srcPdf = await PDFLib.PDFDocument.load(pdfBytes);

  const newPdf = await PDFLib.PDFDocument.create();

  const copiedPages = await newPdf.copyPages(
    srcPdf,
    pageIndexes
  );

  copiedPages.forEach(page=>{
    newPdf.addPage(page);
  });

  const bytes = await newPdf.save();

  downloadBlob(bytes, filename);
}

function getSelectedPages(){

  const checked = document.querySelectorAll(
    '.page-card input:checked'
  );

  return [...checked].map(cb=>{
    return parseInt(cb.value)-1;
  });
}

document.getElementById('downloadSelected')
.addEventListener('click', async ()=>{

  if(!pdfBytes){
    alert('Pilih PDF terlebih dahulu');
    return;
  }

  const pages = getSelectedPages();

  if(!pages.length){
    alert('Pilih halaman');
    return;
  }

  for(let i=0;i<pages.length;i++){

    await createPdf(
      [pages[i]],
      'halaman-'+(pages[i]+1)+'.pdf'
    );
  }

});

document.getElementById('downloadAll')
.addEventListener('click', async ()=>{

  if(!pdfDoc){
    alert('Pilih PDF terlebih dahulu');
    return;
  }

  for(let i=0;i<pdfDoc.numPages;i++){

    await createPdf(
      [i],
      'halaman-'+(i+1)+'.pdf'
    );
  }

});

function parseRanges(text){

  const result = [];

  const parts = text.split(',');

  parts.forEach(part=>{

    part = part.trim();

    if(part.includes('-')){

      const range = part.split('-');

      const start = parseInt(range[0]);
      const end = parseInt(range[1]);

      const arr = [];

      for(let i=start;i<=end;i++){
        arr.push(i-1);
      }

      result.push(arr);

    }else{

      result.push([
        parseInt(part)-1
      ]);

    }

  });

  return result;
}

document.getElementById('downloadRange')
.addEventListener('click', async ()=>{

  if(!pdfBytes){
    alert('Pilih PDF terlebih dahulu');
    return;
  }

  const text =
    document.getElementById('rangeInput')
    .value
    .trim();

  if(!text){
    alert('Masukkan range');
    return;
  }

  const groups = parseRanges(text);

  for(let i=0;i<groups.length;i++){

    const label = groups[i]
      .map(v=>v+1)
      .join('-');

    await createPdf(
      groups[i],
      'split-'+label+'.pdf'
    );
  }

});

</script>

</body>
</html>
